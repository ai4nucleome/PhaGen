model:
  attn_implementation: flash_attention_2

data:
  train_path: /path/to/megadna_training_dataset_train95_seed42.parquet
  val_path: /path/to/megadna_training_dataset_val05_seed42.parquet
  dataloader_type: native
  data_type: plaintext
  max_seq_len: 131072
  text_keys: sequence
  drop_last: true
  datasets_type: packing
  prefetch_factor: 2
  num_workers: 2
  pin_memory: true

train:
  num_train_epochs: 50
  output_dir: outputs/paper_reference_new_run
  data_parallel_mode: ddp
  ulysses_parallel_size: 1
  global_batch_size: 72
  micro_batch_size: 1
  rmpad: false
  rmpad_with_pos_ids: false
  enable_masking: true
  bsz_warmup_ratio: 0.0
  dyn_bsz_margin: 0
  dyn_bsz_buffer_size: 100
  optimizer: adamw
  lr: 2.0e-5
  lr_decay_style: cosine
  lr_warmup_ratio: 0.0
  lr_decay_ratio: 1.0
  lr_min: 3.0e-6
  weight_decay: 0.1
  max_grad_norm: 1.0
  seed: 42
  enable_mixed_precision: true
  enable_gradient_checkpointing: false
  enable_full_shard: false
  enable_fsdp_offload: false
  enable_activation_offload: false
  init_device: cuda
  enable_full_determinism: false
  empty_cache_steps: 500
  ckpt_manager: bytecheckpoint
  load_checkpoint_path: ""
  save_steps: 200
  save_epochs: 100
  eval_steps: 200
  eval_anchor_seed: 114514
  save_hf_weights: true
  use_wandb: false
  wandb_project: phagen
  wandb_name: paper_reference_new_run

